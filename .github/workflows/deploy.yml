# GitHub Actions: ConoHa VPSへの自動デプロイ
# mainブランチへのpush時にVPSへ自動デプロイを実行
# - 詳細ログ出力
# - 失敗時のDiscord通知
# - ヘルスチェック

name: Deploy to ConoHa VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DEPLOY_PATH: /var/www/boyscout-tajimi
  APP_NAME: boyscout-tajimi
  SITE_URL: https://www.tajimibs.org

jobs:
  build:
    name: 🧪 Build Check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 コードをチェックアウト
        uses: actions/checkout@v4

      - name: 📦 Node.jsセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 依存関係インストール
        run: npm ci

      - name: 🔨 ビルド・構文チェック
        run: npm run build

      - name: ✅ 構文チェック (Server)
        run: node --check src/server/server.js

      - name: ❌ ビルド失敗通知 (Discord)
        if: failure()
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          COMMIT_SHA="${{ github.sha }}"
          COMMIT_SHORT="${COMMIT_SHA:0:7}"
          ACTOR="${{ github.actor }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"❌ ビルド失敗\",
                \"description\": \"**${{ env.APP_NAME }}** のビルドテストでエラーが発生しました。デプロイを中止します。\",
                \"color\": 15158332,
                \"fields\": [
                  {\"name\": \"コミット\", \"value\": \"[\`${COMMIT_SHORT}\`](https://github.com/${{ github.repository }}/commit/${COMMIT_SHA})\", \"inline\": true},
                  {\"name\": \"実行者\", \"value\": \"${ACTOR}\", \"inline\": true},
                  {\"name\": \"ログ\", \"value\": \"[Actions ログを確認](${RUN_URL})\", \"inline\": false}
                ],
                \"footer\": {\"text\": \"GitHub Actions - Build Check\"},
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
              }]
            }" || true

  deploy:
    name: 🚀 Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 コードをチェックアウト
        uses: actions/checkout@v4


      - name: 🔑 SSHキーをセットアップ
        id: ssh_setup
        run: |
          set -e
          echo "::group::SSH設定"
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY_BASE64 }}" | tr -d '\r\n ' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          echo "✅ SSHキー設定完了"
          echo "::endgroup::"

      - name: 🚀 VPSへデプロイ
        id: deploy
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            deploy@${{ secrets.VPS_HOST }} << 'ENDSSH'
              set -euo pipefail
              
              echo "=========================================="
              echo "🚀 デプロイ開始: $(date '+%Y-%m-%d %H:%M:%S')"
              echo "=========================================="
              
              cd /var/www/boyscout-tajimi
              NPM_CI_FAILED=0
              DEPS_CHANGED=0

              # システムにない場合は、公式配布版をdeployユーザー内に配置する
              if ! command -v soffice >/dev/null; then
                WORD_RUNTIME="$HOME/.local/share/boyscout-tajimi/libreoffice-26.2.7"
                WORD_PROGRAM="$WORD_RUNTIME/opt/libreoffice26.2/program"
                if [[ ! -x "$WORD_PROGRAM/soffice" ]]; then
                  mkdir -p "$(dirname "$WORD_RUNTIME")"
                  WORD_STAGE="$(mktemp -d "$(dirname "$WORD_RUNTIME")/word-install.XXXXXX")"
                  trap 'rm -rf -- "$WORD_STAGE"' EXIT
                  WORD_ARCHIVE="LibreOffice_26.2.7_Linux_x86-64_deb.tar.gz"
                  curl -fsSL --max-time 180 "https://download.documentfoundation.org/libreoffice/stable/26.2.7/deb/x86_64/$WORD_ARCHIVE" -o "$WORD_STAGE/$WORD_ARCHIVE"
                  (
                    cd "$WORD_STAGE"
                    echo "8cd04a88396a9230264ff784ec89cc090cbfd0960c192483ba2b80fa53939416  $WORD_ARCHIVE" | sha256sum -c -
                    tar -xzf "$WORD_ARCHIVE"
                    mkdir runtime
                    for package in LibreOffice_*/DEBS/*.deb; do
                      dpkg-deb -x "$package" runtime
                    done
                    mv runtime "$WORD_RUNTIME"
                  )
                fi
                if [[ ! -f "$WORD_RUNTIME/deps/.ubuntu-writer-libraries" ]]; then
                  WORD_DEPS="$(mktemp -d "$(dirname "$WORD_RUNTIME")/word-deps.XXXXXX")"
                  trap 'rm -rf -- "${WORD_STAGE:-}" "$WORD_DEPS"' EXIT
                  mkdir -p "$WORD_DEPS"/{lists/partial,cache,debs}
                  APT_PATHS=(-o "Dir::State::lists=$WORD_DEPS/lists" -o "Dir::Cache=$WORD_DEPS/cache")
                  apt-get "${APT_PATHS[@]}" update
                  WORD_PACKAGE_PLAN="$(apt-get "${APT_PATHS[@]}" --simulate --no-install-recommends install libreoffice-writer fonts-noto-cjk)"
                  mapfile -t WORD_PACKAGES < <(printf '%s\n' "$WORD_PACKAGE_PLAN" |
                    awk '$1 == "Inst" && $2 !~ /^(libreoffice|libuno|uno|ure|python3-uno)/ {print $2}')
                  (
                    cd "$WORD_DEPS/debs"
                    apt-get "${APT_PATHS[@]}" download libcairo2 libxinerama1 libxrandr2 "${WORD_PACKAGES[@]}"
                    mkdir -p "$WORD_RUNTIME/deps"
                    for package in *.deb; do
                      dpkg-deb -x "$package" "$WORD_RUNTIME/deps"
                    done
                  )
                  mkdir -p "$WORD_RUNTIME/bin" "$HOME/.local/share/fonts"
                  ln -sfn "$WORD_RUNTIME/deps/usr/share/fonts/opentype/noto" "$HOME/.local/share/fonts/boyscout-word"
                  printf '%s\n' '#!/bin/sh' \
                    'runtime="$(CDPATH="" cd -- "$(dirname -- "$0")/.." && pwd)"' \
                    'export LD_LIBRARY_PATH="$runtime/deps/usr/lib/x86_64-linux-gnu${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"' \
                    'exec "$runtime/opt/libreoffice26.2/program/soffice" "$@"' > "$WORD_RUNTIME/bin/soffice"
                  chmod +x "$WORD_RUNTIME/bin/soffice"
                  touch "$WORD_RUNTIME/deps/.ubuntu-writer-libraries"
                fi
                export PATH="$WORD_RUNTIME/bin:$PATH"
                LD_LIBRARY_PATH="$WORD_RUNTIME/deps/usr/lib/x86_64-linux-gnu" \
                  ldd "$WORD_PROGRAM/oosplash" "$WORD_PROGRAM/soffice.bin" "$WORD_PROGRAM/libmergedlo.so" |
                  awk '/not found/ {print}'
              fi
              soffice --version
              
              # Step 1: Git fetch
              echo ""
              echo "📦 [1/5] 最新コードを取得中..."
              CURRENT_COMMIT=$(git rev-parse HEAD)
              CURRENT_COMMIT_SHORT=$(git rev-parse --short HEAD)
              git fetch origin main
              if ! git diff --quiet HEAD origin/main -- package.json package-lock.json yarn.lock; then
                DEPS_CHANGED=1
                echo "   ℹ️ 依存関係定義の変更を検出しました"
              fi
              git reset --hard origin/main
              NEW_COMMIT=$(git rev-parse --short HEAD)
              echo "   ✅ 更新完了: $CURRENT_COMMIT_SHORT → $NEW_COMMIT"
              
              # Step 2: npm install
              echo ""
              echo "📦 [2/5] 依存関係をインストール中..."
              if npm ci --omit=dev; then
                echo "   ✅ npm ci 完了"
              else
                NPM_CI_FAILED=1
                if [ "$DEPS_CHANGED" = "1" ]; then
                  echo "   ❌ npm ci に失敗し、依存関係定義も変更されています。直前のコミットへロールバックします。"
                  git reset --hard "$CURRENT_COMMIT"
                  pm2 restart boyscout-tajimi --update-env
                  sleep 3
                  pm2 status boyscout-tajimi
                  exit 1
                fi
                echo "   ⚠️ npm ci に失敗しましたが、依存関係定義は未変更のため既存の node_modules で継続します。"
              fi
              
              # Step 3: Build
              echo ""
              echo "🔨 [3/5] ビルド実行中..."
              npm run build
              TEST_LIBREOFFICE=1 node --test test/word-import.test.js
              echo "   ✅ ビルド完了"
              
              # Step 4: PM2 restart
              echo ""
              echo "🔄 [4/5] アプリケーション再起動中..."
              pm2 restart boyscout-tajimi --update-env
              sleep 3
              pm2 status boyscout-tajimi
              echo "   ✅ PM2再起動完了"
              
              # Step 5: Health check
              echo ""
              echo "🏥 [5/5] ヘルスチェック中..."
              # 起動待機
              sleep 5
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ --max-time 10) || HTTP_STATUS="000"
              
              if [ "$HTTP_STATUS" = "200" ]; then
                echo "   ✅ サーバー応答OK (HTTP $HTTP_STATUS)"
              else
                echo "   ❌ サーバー応答エラー: HTTP $HTTP_STATUS"
                echo "::group::📊 アプリケーションログ (直近50行)"
                echo "--- Error Log ---"
                pm2 logs boyscout-tajimi --lines 50 --err --nostream
                echo ""
                echo "--- Output Log ---"
                pm2 logs boyscout-tajimi --lines 50 --out --nostream
                echo "::endgroup::"
                exit 1
              fi

              node tools/verify-word-webhook.js
              
              DEPLOY_TIME=$(date '+%Y-%m-%d %H:%M:%S')
              echo ""
              echo "=========================================="
              echo "✅ デプロイ完了: $DEPLOY_TIME"
              echo "   コミット: $NEW_COMMIT"
              echo "=========================================="

              if [ "$NPM_CI_FAILED" = "1" ]; then
                echo "⚠️ 依存関係の再インストールに失敗しました。VPS 上の権限を修正してください。"
              fi
              
              # 環境変数として出力（後続ステップで使用）
              echo "DEPLOY_TIME=$DEPLOY_TIME" >> /tmp/deploy_env
              echo "NEW_COMMIT=$NEW_COMMIT" >> /tmp/deploy_env
          ENDSSH

      - name: ✅ 成功通知 (Discord)
        if: success()
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          COMMIT_SHA="${{ github.sha }}"
          COMMIT_SHORT="${COMMIT_SHA:0:7}"
          ACTOR="${{ github.actor }}"
          
          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"✅ デプロイ成功\",
                \"description\": \"**${{ env.APP_NAME }}** が正常にデプロイされました\",
                \"color\": 5763719,
                \"fields\": [
                  {\"name\": \"コミット\", \"value\": \"[\`${COMMIT_SHORT}\`](https://github.com/${{ github.repository }}/commit/${COMMIT_SHA})\", \"inline\": true},
                  {\"name\": \"実行者\", \"value\": \"${ACTOR}\", \"inline\": true},
                  {\"name\": \"メッセージ\", \"value\": \"${COMMIT_MSG:0:100}\", \"inline\": false}
                ],
                \"footer\": {\"text\": \"GitHub Actions\"},
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
              }]
            }" || true

      - name: ❌ 失敗通知 (Discord)
        if: failure()
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          COMMIT_SHA="${{ github.sha }}"
          COMMIT_SHORT="${COMMIT_SHA:0:7}"
          ACTOR="${{ github.actor }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"❌ デプロイ失敗\",
                \"description\": \"**${{ env.APP_NAME }}** のデプロイに失敗しました\",
                \"color\": 15158332,
                \"fields\": [
                  {\"name\": \"コミット\", \"value\": \"[\`${COMMIT_SHORT}\`](https://github.com/${{ github.repository }}/commit/${COMMIT_SHA})\", \"inline\": true},
                  {\"name\": \"実行者\", \"value\": \"${ACTOR}\", \"inline\": true},
                  {\"name\": \"ログ\", \"value\": \"[Actions ログを確認](${RUN_URL})\", \"inline\": false}
                ],
                \"footer\": {\"text\": \"GitHub Actions\"},
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
              }]
            }" || true

      - name: 🧹 クリーンアップ
        if: always()
        run: rm -f ~/.ssh/deploy_key
